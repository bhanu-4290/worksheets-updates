version: "3.8"

services:
  # Primary Enterprise PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: worktrack-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worktrack_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-WorkTrackSecurePass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-worktrack_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/backup.sh:/usr/local/bin/backup.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worktrack_admin} -d ${POSTGRES_DB:-worktrack_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # WorkTrack Node/Express API Server
  api:
    build:
      context: ../../server
      dockerfile: ../deploy/docker/Dockerfile.server
    container_name: worktrack-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-worktrack_admin}:${POSTGRES_PASSWORD:-WorkTrackSecurePass2026!}@postgres:5432/${POSTGRES_DB:-worktrack_db}?schema=public
      USE_SYSTEM_POSTGRES: "true"
      JWT_SECRET: ${JWT_SECRET:-worktrack_production_jwt_secret_key_random_32_bytes_min}
      JWT_EXPIRES_IN: "7d"
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:80}
    ports:
      - "5000:5000"

  # Nginx Gateway & Static Assets Server
  frontend:
    build:
      context: ../../client
      dockerfile: ../deploy/docker/Dockerfile.client
    container_name: worktrack-web
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro

volumes:
  postgres_data:
    driver: local
